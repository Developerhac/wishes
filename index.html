<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio autoplay loop>
    <source src="teri.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <canvas id="fireworks"></canvas>

  <div class="container">
    <h1>🎉 Happy Birthday to an Amazing Friend! 🎉</h1>
    <img src="cat.jpg" alt="Her Smiling Face" class="photo">
    <p>May your birthday be filled with laughter, happiness, and all the things you love! 🥳</p>
    <button onclick="showMessage()">Click for a Surprise 💌</button>
    <div id="secretMessage" class="hidden">
      <p>You’re a gem, a shining light,</p>
      <p>May your dreams take the highest flight! 🌟</p>
      <p>Stay awesome, stay blessed,</p>
      <p>Wishing you all the happiness and success! 🎁</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="fireworks.js"></script>
</body>
</html>
